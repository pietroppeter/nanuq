name: CI

# Commits that only touch prose (README, BACKLOG, LICENSE, ...) or OpenSpec
# planning files (openspec/, .claude/) don't run CI. Two exceptions: docs/ (it
# rebuilds the dev log) and openspec/specs/ (its examples are run, see
# tools/specexamples.nim). paths-ignore cannot re-include a path, so this uses
# paths with negations: the last pattern that matches a file wins.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
      - "!openspec/**"
      - "!.claude/**"
      - "!tools/specview.nim"
      - "!.github/workflows/openspec.yml"
      - "openspec/specs/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
      - "!openspec/**"
      - "!.claude/**"
      - "!tools/specview.nim"
      - "!.github/workflows/openspec.yml"
      - "openspec/specs/**"
  workflow_dispatch:

# The Polars wrapper (src/rust/) is the slow part: a cold build takes ~9 minutes.
# It is built once per change of src/rust/, cached by a hash of its sources, and
# shared with the other jobs as a prebuilt static library.
env:
  LIB_DIR: src/rust/target/release

jobs:
  # A released lib version must keep matching its sources: after lib-v<version>,
  # any change to src/rust/ needs the next -dev version in Cargo.toml, or users
  # would download a library that doesn't match the code.
  lib-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          version=$(grep -m1 '^version' src/rust/Cargo.toml | cut -d'"' -f2)
          case "$version" in *-dev) echo "development version $version"; exit 0;; esac
          if git rev-parse -q --verify "refs/tags/lib-v$version" > /dev/null &&
             ! git diff --quiet "lib-v$version" -- src/rust; then
            echo "::error::src/rust changed since lib-v$version. Bump the version in src/rust/Cargo.toml to a -dev version (for example the next patch, with a -dev suffix) until the next lib release."
            git diff --stat "lib-v$version" -- src/rust
            exit 1
          fi
          echo "lib version $version is consistent"

  rust-lib:
    name: build libnanuq_ffi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=nanuq-ffi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock', 'src/rust/src/**') }}" >> "$GITHUB_OUTPUT"
      # exact-key cache of the finished library: a hit skips Rust entirely
      - id: lib-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LIB_DIR }}/libnanuq_ffi.a
          key: ${{ steps.key.outputs.key }}
      - if: steps.lib-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      # on a miss, reuse compiled dependencies (Polars) so only our crate rebuilds
      - if: steps.lib-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
      - if: steps.lib-cache.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path src/rust/Cargo.toml
      - run: ls -lh "$LIB_DIR/libnanuq_ffi.a"
      - uses: actions/upload-artifact@v4
        with:
          name: libnanuq_ffi-linux-x64
          path: ${{ env.LIB_DIR }}/libnanuq_ffi.a
          retention-days: 7

  test:
    needs: rust-lib
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libnanuq_ffi-linux-x64
          path: ${{ env.LIB_DIR }}
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # tests/test_datamancer.nim and test_arraymancer.nim need Datamancer (an optional
      # dependency, which brings Arraymancer); tests/test_database.nim needs db_connector
      - run: nimble install -y datamancer db_connector
      # -d:nanuqNoCargo: fail rather than silently rebuild Rust here
      - run: for t in tests/test_*.nim; do nim r -d:nanuqNoCargo --hints:off "$t"; done
      - run: nim r -d:nanuqNoCargo --hints:off examples/basic.nim
      # the examples in openspec/specs must still compile, run and print what they show
      - run: nim r --hints:off tools/specexamples.nim -d:nanuqNoCargo

  docs:
    needs: rust-lib
    runs-on: ubuntu-24.04  # still ships libpcre3, which nimib's markdown renderer needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libnanuq_ffi-linux-x64
          path: ${{ env.LIB_DIR }}
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libpcre3 libcairo2 liblapack3 libblas3
      # ggplotnim is for the plotting post; stb_image comes from its GitHub mirror;
      # plotly (nim-plotly) is for the explainers' figures (El Niño, Above 4000)
      - run: nimble install -y nimib https://github.com/define-private-public/stb_image-Nim ggplotnim plotly@0.3.3
      - name: Render dev log posts
        run: for f in docs/blog/*.nim; do nim r -d:nanuqNoCargo --hints:off "$f"; done
      # the index lists the rendered posts, so it comes after them
      - name: Render the index
        run: nim r --hints:off docs/index.nim
      - name: Assemble site
        run: |
          mkdir -p _site/blog
          cp docs/blog/*.html docs/blog/*.png _site/blog/
          cp docs/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
