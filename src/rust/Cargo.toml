[package]
name = "nanuq_ffi"
version = "0.2.0"
edition = "2021"
description = "C ABI over Polars, consumed by the Nanuq Nim library"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
polars = { version = "0.55", default-features = false, features = ["lazy", "csv", "fmt", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "semi_anti_join", "cross_join", "diagonal_concat", "random", "is_in", "is_between", "abs", "round_series"] }
# Only for polars_core::random::set_global_random_seed, which polars does not re-export.
polars-core = { version = "0.55", default-features = false }

[profile.release]
opt-level = 3

# Release archives (release-lib.yml): halves the archive (44 → 22 MB gzipped on
# x86_64 Linux) for a slower build (12 instead of 7 minutes), so local builds keep
# the plain release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
