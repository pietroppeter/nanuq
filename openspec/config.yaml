schema: spec-driven

context: |
  Nanuq wraps the Rust Polars library for Nim through a C ABI:
  rust/ (nanuq_ffi crate, extern "C", opaque pointers) -> src/nanuq/ffi.nim (raw importc)
  -> src/nanuq.nim (Nim API with destructors).
  Every change to the C ABI must update rust/src/lib.rs and src/nanuq/ffi.nim together.
  A cold Rust build compiles Polars and takes about 10 minutes, so CI and user-facing
  workflows should avoid rebuilding it when rust/ has not changed.
  Targets: Nim >= 2.0, stable Rust; Linux x64 first, then macOS and Windows.
  Ideas that are not yet a change live in BACKLOG.md at the repo root.

rules:
  proposal:
    - If the change comes from a BACKLOG.md entry, name that entry, and mark it in
      BACKLOG.md as in progress with the change name
    - Include a "Differences from Polars" section listing every expected difference
      between the proposed Nim API and Polars' Rust and Python APIs (behavior and
      names), or saying there are none

operations:
  apply:
    guidance:
      - Proposal and implementation go in separate PRs. Before applying, check that the
        proposal's PR is merged into main; if not, ask for it to be merged first. Then
        implement on a fresh branch from main and open a new PR
  archive:
    guidance:
      - Remove the change's entry from BACKLOG.md, if it has one
      - Add a line for the change to CHANGELOG.md under Unreleased (Added, Changed or Fixed), with the PR number

